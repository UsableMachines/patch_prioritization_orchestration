{% extends "layouts/base.html" %}
{% block body_class %}page-login{% endblock %}
{% block title %}Login — Patch Prioritization{% endblock %}
{% block content_unauth %}
<div class="auth-card">
  <div class="auth-logo">
    <i class="fas fa-shield-halved"></i>
    <h1>PatchPriority</h1>
    <p>Patch Prioritization & Orchestration</p>
  </div>
  <form method="POST" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" class="form-control" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    <p class="auth-link">Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  </form>
</div>
{% endblock %}
